# Lint and run the regression suite on every push and PR.

name: Tests

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  lint-and-test:
    name: Lint + unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install ruff

      - name: Lint with Ruff
        run: python -m ruff check app tests

      - name: Run the regression test suite
        run: python -m unittest discover -s tests -p "test_regression_fixes.py" -v

      # These suites are standalone scripts (each prints a pass count and
      # exits non-zero on failure), so run them directly rather than via
      # unittest discovery, which would collect 0 tests and error out.
      # (The HTML parser smoke test is a manual dev tool: it needs a sample
      # page fetched to a local path first, so it is not run in CI.)
      - name: Run the typography tests
        run: python tests/test_normalize_typography.py

      - name: Run the note-prefix tests
        run: python tests/test_note_prefix.py
