# Lint and run the regression suite on every push and PR.

name: Tests

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  lint-and-test:
    name: Lint + unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install ruff

      - name: Lint with Ruff
        run: python -m ruff check app tests

      - name: Run the regression test suite
        run: python -m unittest discover -s tests -p "test_regression_fixes.py" -v

      - name: Run the HTML parser smoke tests
        run: python -m unittest discover -s tests -p "test_html_parser_smoke.py" -v

      - name: Run the typography tests
        run: python -m unittest discover -s tests -p "test_normalize_typography.py" -v

      - name: Run the note-prefix tests
        run: python -m unittest discover -s tests -p "test_note_prefix.py" -v
